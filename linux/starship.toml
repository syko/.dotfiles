[line_break]
disabled = true

[character]
success_symbol = '[\$](bold green)'

[username]
show_always = true
format = '[$user]($style)@'

[directory]
truncation_length = 2

[git_branch]
symbol = ''
format = '[$symbol$branch(:$remote_branch)]($style) '

[nodejs]
format = '[$symbol($version )]($style)'
disabled = true

[deno]
format = '[$symbol($version )]($style)'
disabled = true

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
disabled = true

[package]
format = '[$symbol$version]($style) '

[gcloud]
disabled = true
